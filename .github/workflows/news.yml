name: news
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official RSS
        continue-on-error: true
        run: python3 fetch_news.py
      - name: Fetch market heatmap data
        continue-on-error: true
        run: python3 fetch_heat.py
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for f in news.json heat.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "no change"; else git commit -m "data: update" && git pull --rebase && git push; fi
